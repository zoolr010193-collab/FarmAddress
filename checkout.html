<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2D5016" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/images/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>FarmAddress | إتمام الطلب</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="checkout.css" />
    <link rel="stylesheet" href="i18n.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>FarmAddress</span>
        </div>

        <nav class="main-nav" aria-label="التنقل الرئيسي">
          <a href="index.html">الرئيسية</a>
          <a href="index.html#farms">المزارع</a>
          <a href="cart.html">السلة</a>
        </nav>

        <div class="nav-actions">
          <a href="orders.html" class="button secondary">طلباتي</a>
        </div>
      </div>
    </header>

    <main class="container checkout-page">
      <section class="checkout-header">
        <span class="eyebrow">إتمام الطلب</span>
        <h1>تأكيد الطلب والتسليم</h1>
      </section>

      <section class="checkout-layout">
        <form id="checkoutForm" class="checkout-form">
          <div class="form-grid">
            <label>
              الاسم الكامل
              <input type="text" name="fullName" required placeholder="أدخل اسمك" />
            </label>

            <label>
              رقم الهاتف
              <input type="tel" name="phone" required placeholder="05xxxxxxxx" />
            </label>

            <label class="full-width">
              المدينة
              <input type="text" name="city" required placeholder="مثل: الخرطوم" />
            </label>

            <label class="full-width">
              عنوان التوصيل
              <textarea name="address" rows="4" required placeholder="اكتب عنوانك بالتفصيل"></textarea>
            </label>

            <label class="full-width">
              طريقة الدفع
              <select name="paymentMethod" required>
                <option value="">اختر طريقة الدفع</option>
                <option value="cash">الدفع عند الاستلام</option>
                <option value="card">بطاقة ائتمانية</option>
                <option value="wallet">محفظة إلكترونية</option>
              </select>
            </label>
          </div>

          <button type="submit" class="button primary w-full">تأكيد الطلب</button>
        </form>

        <aside class="summary-box">
          <h2>ملخص الطلب</h2>
          <div id="checkoutItems" class="checkout-items"></div>
          <div class="summary-row total-row">
            <span>الإجمالي</span>
            <strong id="checkoutTotal">0 جنيه</strong>
          </div>
          <a href="cart.html" class="back-link">تعديل السلة</a>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 FarmAddress. جميع الحقوق محفوظة.</p>
      </div>
    </footer>

    <script src="firebase-config.js"></script>
    <script src="db.js"></script>
    <script src="i18n.js"></script>
    <script src="pwa.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2D5016" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/images/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>FarmAddress | سلة المشتريات</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="cart.css" />
    <link rel="stylesheet" href="i18n.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>FarmAddress</span>
        </div>

        <nav class="main-nav" aria-label="التنقل الرئيسي">
          <a href="index.html">الرئيسية</a>
          <a href="index.html#farms">المزارع</a>
          <a href="index.html#products">المنتجات</a>
        </nav>

        <div class="nav-actions">
          <a href="index.html" class="button secondary">متابعة التسوق</a>
        </div>
      </div>
    </header>

    <main class="container cart-page">
      <section class="cart-header">
        <div>
          <span class="eyebrow">السلة</span>
          <h1>مشترياتي</h1>
        </div>
      </section>

      <section class="cart-layout">
        <div class="cart-items" id="cartItems"></div>

        <aside class="summary-box">
          <h2>ملخص الطلب</h2>
          <div class="summary-row">
            <span>إجمالي المنتجات</span>
            <strong id="itemsTotal">0 جنيه</strong>
          </div>
          <div class="summary-row">
            <span>التوصيل</span>
            <strong>مجاني</strong>
          </div>
          <div class="summary-row total-row">
            <span>الإجمالي</span>
            <strong id="grandTotal">0 جنيه</strong>
          </div>
          <button class="button primary w-full" type="button">إتمام الطلب</button>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 FarmAddress. جميع الحقوق محفوظة.</p>
      </div>
    </footer>

    <script src="firebase-config.js"></script>
    <script src="db.js"></script>
    <script src="i18n.js"></script>
    <script src="pwa.js"></script>
    <script src="cart.js"></script>
  </body>
</html>
